spring.application.name=pokedex-api

# Porta do servidor. O Render injeta a variavel PORT; localmente usa 8080.
server.port=${PORT:8080}

# Mensagens de erro mais amigaveis (o GlobalExceptionHandler cuida do formato)
server.error.include-message=always
server.error.include-stacktrace=never

# Log da aplicacao
logging.level.br.com.fiap.pokedex=INFO

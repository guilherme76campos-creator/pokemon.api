<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pokédex - API</title>
<style>
  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #eef2f7;
    color: #222;
    margin: 0;
    padding: 24px;
  }

  header {
    max-width: 900px;
    margin: 0 auto 16px;
    background: #d62828;
    color: #fff;
    border-radius: 8px;
    padding: 16px 20px;
    box-shadow: 0 2px 6px rgba(0, 0, 0, .15);
  }
  header h1 { font-size: 22px; margin: 0; }
  header p { margin: 4px 0 0; font-size: 13px; opacity: .9; }

  .box {
    background: #fff;
    border: 1px solid #dbe2ef;
    border-radius: 8px;
    padding: 16px;
    margin: 0 auto 16px;
    max-width: 900px;
    box-shadow: 0 1px 4px rgba(31, 58, 147, .06);
  }

  h2 { font-size: 16px; margin: 0 0 12px; color: #1f3a93; }

  label { display: block; font-size: 12px; color: #555; margin-bottom: 4px; }
  input, select {
    width: 100%;
    padding: 7px;
    border: 1px solid #c6cfe0;
    border-radius: 4px;
    font-size: 14px;
    box-sizing: border-box;
    background: #fff;
  }
  input:focus, select:focus {
    outline: 2px solid #9ec5fe;
    border-color: #2d6cdf;
  }

  .linha { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .linha > div { flex: 1; min-width: 150px; }

  button {
    padding: 8px 14px;
    font-size: 14px;
    border: 1px solid #c6cfe0;
    border-radius: 4px;
    background: #f1f4f9;
    color: #333;
    cursor: pointer;
  }
  button:hover { background: #e3e9f4; }
  button.principal {
    background: #d62828;
    border-color: #b91f1f;
    color: #fff;
    font-weight: bold;
  }
  button.principal:hover { background: #b91f1f; }
  button.pequeno { padding: 4px 8px; font-size: 12px; }
  button.excluir { color: #b00020; border-color: #f0b5b5; background: #fdf1f1; }
  button.excluir:hover { background: #fbe0e0; }

  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th {
    background: #e8eefc;
    color: #1f3a93;
    text-align: left;
    padding: 9px 8px;
    border-bottom: 2px solid #c9d6f2;
    font-size: 13px;
  }
  td { padding: 8px; border-bottom: 1px solid #e6eaf2; }
  tbody tr:nth-child(even) { background: #fafbff; }
  tbody tr:hover { background: #eef4ff; }

  .tipo {
    display: inline-block;
    padding: 2px 9px;
    border-radius: 10px;
    font-size: 12px;
    font-weight: bold;
    border: 1px solid transparent;
  }

  #msg { margin-top: 12px; font-size: 14px; padding: 8px 10px; border-radius: 6px; }
  #msg:empty { display: none; }
  #msg.ok { background: #e7f7ec; color: #0a7a2f; border: 1px solid #b7e4c7; }
  #msg.erro { background: #fdeaea; color: #b00020; border: 1px solid #f5b5b5; }

  #vazio { color: #777; font-size: 14px; display: none; }
</style>
</head>
<body>

<header>
  <h1>Pokédex</h1>
  <p>API RESTful em Spring Boot &mdash; FIAP</p>
</header>

<div class="box">
  <label for="api">URL da API</label>
  <div class="linha">
    <div style="flex:4">
      <input id="api" type="text" value="http://localhost:8080" spellcheck="false">
    </div>
    <div style="flex:0">
      <button onclick="trocarApi()">Conectar</button>
    </div>
  </div>
</div>

<div class="box">
  <h2 id="titulo">Novo pokémon</h2>

  <div class="linha">
    <div>
      <label for="nome">Nome</label>
      <input id="nome" type="text" maxlength="50" placeholder="Ex.: Eevee">
    </div>
    <div>
      <label for="tipo">Tipo</label>
      <select id="tipo">
        <option>Fogo</option><option>Água</option><option>Planta</option>
        <option>Elétrico</option><option>Psíquico</option><option>Normal</option>
        <option>Lutador</option><option>Veneno</option><option>Terra</option>
        <option>Voador</option><option>Inseto</option><option>Pedra</option>
        <option>Fantasma</option><option>Dragão</option><option>Aço</option>
        <option>Fada</option><option>Sombrio</option><option>Gelo</option>
      </select>
    </div>
    <div>
      <label for="nivel">Nível (1 a 100)</label>
      <input id="nivel" type="number" min="1" max="100" value="10">
    </div>
    <div>
      <label for="data">Data de captura</label>
      <input id="data" type="date">
    </div>
  </div>

  <div style="margin-top:12px">
    <button class="principal" onclick="salvar()">Salvar</button>
    <button onclick="limpar()">Limpar</button>
  </div>

  <div id="msg"></div>
</div>

<div class="box">
  <h2>Pokémons cadastrados (<span id="total">0</span>)</h2>

  <table>
    <thead>
      <tr>
        <th>Código</th><th>Nome</th><th>Tipo</th><th>Nível</th><th>Captura</th><th>Ações</th>
      </tr>
    </thead>
    <tbody id="corpo"></tbody>
  </table>

  <p id="vazio">Nenhum pokémon cadastrado.</p>
</div>

<script>
  let editando = null;
  let lista = [];

  const CORES = {
    "Fogo": "#d9480f", "Água": "#1c7ed6", "Planta": "#2b8a3e", "Elétrico": "#c98a00",
    "Psíquico": "#c2255c", "Normal": "#6c757d", "Lutador": "#e8590c", "Veneno": "#7048e8",
    "Terra": "#a05a2c", "Voador": "#5c7cfa", "Inseto": "#74b816", "Pedra": "#868e96",
    "Fantasma": "#5f3dc4", "Dragão": "#364fc7", "Aço": "#4c6ef5", "Fada": "#d6336c",
    "Sombrio": "#343a40", "Gelo": "#1098ad"
  };

  const $ = (id) => document.getElementById(id);

  function base() {
    return $("api").value.trim().replace(/\/+$/, "");
  }

  function mensagem(texto, erro) {
    const el = $("msg");
    el.textContent = texto;
    el.className = erro ? "erro" : "ok";
  }

  function trocarApi() {
    localStorage.setItem("pokedex_api", base());
    carregar();
  }

  async function chamar(metodo, caminho, corpo) {
    const opcoes = { method: metodo, headers: {} };
    if (corpo) {
      opcoes.headers["Content-Type"] = "application/json";
      opcoes.body = JSON.stringify(corpo);
    }

    const resp = await fetch(base() + caminho, opcoes);
    const texto = await resp.text();

    let dados = null;
    if (texto) {
      try { dados = JSON.parse(texto); } catch { dados = texto; }
    }
    return { status: resp.status, ok: resp.ok, dados };
  }

  function textoErro(dados) {
    if (dados && dados.campos) {
      return Object.entries(dados.campos).map(([campo, texto]) => campo + ": " + texto).join(" | ");
    }
    if (dados && dados.mensagem) return dados.mensagem;
    if (typeof dados === "string") return dados;
    return "erro na requisição";
  }

  async function carregar(exibirMensagem = true) {
    try {
      const r = await chamar("GET", "/pokemon");

      if (r.status === 404) {
        lista = [];
        desenhar();
        if (exibirMensagem) mensagem("Pokédex vazia. Cadastre o primeiro pokémon.");
        return;
      }
      if (!r.ok) {
        if (exibirMensagem) mensagem("Erro HTTP " + r.status + ": " + textoErro(r.dados), true);
        return;
      }

      lista = r.dados || [];
      desenhar();
      if (exibirMensagem) mensagem("API conectada (HTTP " + r.status + ").");
    } catch (e) {
      lista = [];
      desenhar();
      if (exibirMensagem) {
        mensagem("Não foi possível conectar na API. Ela está rodando em " + base() + "?", true);
      }
    }
  }

  function desenhar() {
    const corpo = $("corpo");
    corpo.innerHTML = "";
    $("total").textContent = lista.length;
    $("vazio").style.display = lista.length ? "none" : "block";

    for (const p of lista) {
      const cor = CORES[p.tipo] || "#6c757d";
      const tr = document.createElement("tr");
      tr.innerHTML =
        "<td>" + p.codigo + "</td>" +
        "<td>" + escapar(p.nome) + "</td>" +
        '<td><span class="tipo" style="color:' + cor + ";background:" + cor +
          '1a;border-color:' + cor + '55">' + escapar(p.tipo) + "</span></td>" +
        "<td>" + p.nivel + "</td>" +
        "<td>" + p.dataCaptura + "</td>" +
        "<td>" +
          '<button class="pequeno" onclick="editar(' + p.codigo + ')">Editar</button> ' +
          '<button class="pequeno excluir" onclick="apagar(' + p.codigo + ')">Excluir</button>' +
        "</td>";
      corpo.appendChild(tr);
    }
  }

  function escapar(texto) {
    return String(texto).replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  async function salvar() {
    const dados = {
      nome: $("nome").value.trim(),
      tipo: $("tipo").value,
      nivel: Number($("nivel").value),
      dataCaptura: $("data").value || null
    };

    if (!dados.nome) { mensagem("Informe o nome do pokémon.", true); return; }
    if (!dados.dataCaptura) { mensagem("Informe a data de captura.", true); return; }

    try {
      const eraEdicao = editando !== null;
      const r = eraEdicao
        ? await chamar("PUT", "/pokemon/" + editando, dados)
        : await chamar("POST", "/pokemon", dados);

      if (r.status === 201) {
        limpar();
        await carregar(false);
        mensagem((eraEdicao ? "Pokémon atualizado" : "Pokémon cadastrado") + " com sucesso (HTTP 201).");
      } else {
        mensagem("A API recusou (HTTP " + r.status + "): " + textoErro(r.dados), true);
      }
    } catch (e) {
      mensagem("Falha de rede: " + e.message, true);
    }
  }

  function editar(codigo) {
    const p = lista.find((item) => item.codigo === codigo);
    if (!p) return;

    editando = p.codigo;
    $("titulo").textContent = "Editando pokémon #" + p.codigo;
    $("nome").value = p.nome;
    $("tipo").value = p.tipo;
    $("nivel").value = p.nivel;
    $("data").value = p.dataCaptura;
    mensagem("Editando #" + p.codigo + ". Altere e clique em Salvar.");
    window.scrollTo({ top: 0, behavior: "smooth" });
  }

  function limpar() {
    editando = null;
    $("titulo").textContent = "Novo pokémon";
    $("nome").value = "";
    $("nivel").value = 10;
    $("data").value = dataDeOntem();
    $("msg").textContent = "";
  }

  async function apagar(codigo) {
    if (!confirm("Excluir o pokémon #" + codigo + "?")) return;

    try {
      const r = await chamar("DELETE", "/pokemon/" + codigo);
      if (r.status === 204) {
        await carregar(false);
        mensagem("Pokémon #" + codigo + " excluído (HTTP 204).");
      } else {
        mensagem("Não foi possível excluir (HTTP " + r.status + "): " + textoErro(r.dados), true);
      }
    } catch (e) {
      mensagem("Falha de rede: " + e.message, true);
    }
  }

  function dataDeOntem() {
    const d = new Date();
    d.setDate(d.getDate() - 1);
    return d.getFullYear() + "-" +
      String(d.getMonth() + 1).padStart(2, "0") + "-" +
      String(d.getDate()).padStart(2, "0");
  }

  const apiSalva = localStorage.getItem("pokedex_api");
  if (apiSalva) $("api").value = apiSalva;

  limpar();
  carregar();
</script>

</body>
</html>
